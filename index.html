<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodTI - 食物人格测试</title>
    <meta name="description" content="通过20道精选题目，解码你的美食DNA，发现你的食物人格类型">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍕</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #E8652B;
            --primary-light: #FF8C42;
            --primary-dark: #C74E1A;
            --accent: #FFB347;
            --bg-warm: #FFF8F2;
            --bg-card: #FFFFFF;
            --text-dark: #2D1810;
            --text-medium: #5C3D2E;
            --text-light: #8B6B5A;
            --text-muted: #A68B7B;
            --border-light: #FFE4CC;
            --shadow-sm: 0 2px 8px rgba(45, 24, 16, 0.08);
            --shadow-md: 0 8px 24px rgba(45, 24, 16, 0.12);
            --shadow-lg: 0 16px 48px rgba(45, 24, 16, 0.16);
            --radius-sm: 12px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-warm);
            min-height: 100vh;
            color: var(--text-dark);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: 
                radial-gradient(circle at 20% 20%, rgba(232, 101, 43, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 179, 71, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 228, 204, 0.3) 0%, transparent 70%);
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 520px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 首页样式 */
        .home-page {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            animation: fadeInUp 0.8s ease;
        }

        .logo-container {
            position: relative;
            margin-bottom: 32px;
        }

        .logo {
            font-size: 80px;
            line-height: 1;
            filter: drop-shadow(0 8px 16px rgba(232, 101, 43, 0.3));
            animation: float 3s ease-in-out infinite;
        }

        .logo-badge {
            position: absolute;
            top: -8px;
            right: -16px;
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            box-shadow: 0 4px 12px rgba(232, 101, 43, 0.4);
        }

        .title {
            font-size: 52px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 18px;
            color: var(--text-medium);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .subtitle-secondary {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .start-btn {
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
            color: white;
            border: none;
            padding: 18px 64px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 24px rgba(232, 101, 43, 0.35);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .start-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .start-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(232, 101, 43, 0.45);
        }

        .start-btn:hover::before {
            left: 100%;
        }

        .start-btn:active {
            transform: translateY(-2px);
        }

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 56px;
            width: 100%;
        }

        .feature {
            text-align: center;
            padding: 20px 12px;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
        }

        .feature:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }

        .feature-icon {
            font-size: 32px;
            margin-bottom: 10px;
            display: block;
        }

        .feature-text {
            font-size: 13px;
            color: var(--text-light);
            font-weight: 500;
        }

        /* 进度条样式 */
        .progress-container {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 16px 20px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 20px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .progress-text {
            font-size: 14px;
            color: var(--text-light);
            font-weight: 500;
        }

        .progress-percent {
            font-size: 14px;
            color: var(--primary);
            font-weight: 700;
        }

        .progress-bar {
            background: var(--border-light);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-light), var(--primary));
            border-radius: 4px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }

        /* 问题页样式 */
        .question-page {
            flex: 1;
            display: none;
            flex-direction: column;
            padding: 20px 0;
            animation: fadeInUp 0.5s ease;
        }

        .question-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 28px 24px;
            box-shadow: var(--shadow-md);
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }

        .question-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-light), var(--accent));
        }

        .question-dimension {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            color: var(--primary);
            background: rgba(232, 101, 43, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .question-text {
            font-size: 20px;
            font-weight: 600;
            line-height: 1.6;
            color: var(--text-dark);
            margin-bottom: 28px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            background: var(--bg-warm);
            border: 2px solid transparent;
            border-radius: var(--radius-sm);
            padding: 18px 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 15px;
            color: var(--text-medium);
            display: flex;
            align-items: center;
            gap: 14px;
            position: relative;
            overflow: hidden;
        }

        .option-letter {
            width: 32px;
            height: 32px;
            background: var(--bg-card);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: var(--text-light);
            flex-shrink: 0;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
        }

        .option-text {
            flex: 1;
            line-height: 1.5;
        }

        .option:hover {
            border-color: var(--primary-light);
            background: rgba(255, 140, 66, 0.08);
            transform: translateX(4px);
        }

        .option:hover .option-letter {
            background: var(--primary-light);
            color: white;
        }

        .option.selected {
            border-color: var(--primary);
            background: linear-gradient(135deg, rgba(232, 101, 43, 0.08), rgba(255, 179, 71, 0.08));
        }

        .option.selected .option-letter {
            background: var(--primary);
            color: white;
        }

        /* 结果页样式 */
        .result-page {
            flex: 1;
            display: none;
            flex-direction: column;
            padding: 20px 0;
            animation: fadeInUp 0.6s ease;
        }

        .result-hero {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: var(--radius-xl);
            padding: 36px 28px;
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(232, 101, 43, 0.3);
        }

        .result-hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            animation: rotate 20s linear infinite;
        }

        .result-emoji {
            font-size: 72px;
            margin-bottom: 16px;
            position: relative;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
        }

        .result-type-label {
            font-size: 12px;
            font-weight: 700;
            color: rgba(255,255,255,0.8);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            position: relative;
        }

        .result-title {
            font-size: 32px;
            font-weight: 900;
            color: white;
            margin-bottom: 6px;
            position: relative;
        }

        .result-english {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            font-weight: 500;
            letter-spacing: 1px;
            position: relative;
        }

        .result-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-md);
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title-icon {
            font-size: 20px;
        }

        .result-description {
            font-size: 15px;
            color: var(--text-medium);
            line-height: 1.8;
            text-align: justify;
        }

        .traits-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .trait {
            background: linear-gradient(135deg, rgba(232, 101, 43, 0.08), rgba(255, 179, 71, 0.12));
            border: 1px solid rgba(232, 101, 43, 0.15);
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
        }

        /* 雷达图容器 */
        .radar-section {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-md);
            margin-bottom: 16px;
        }

        .radar-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 20px;
            text-align: center;
        }

        .radar-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        #radarChart {
            width: 280px;
            height: 280px;
        }

        .dimension-explanations {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .dimension-card {
            background: var(--bg-warm);
            border-radius: var(--radius-sm);
            padding: 16px;
            transition: all 0.3s ease;
        }

        .dimension-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .dimension-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .dimension-icon {
            font-size: 20px;
        }

        .dimension-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .dimension-score {
            font-size: 24px;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .dimension-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .dimension-desc {
            font-size: 12px;
            color: var(--text-light);
            line-height: 1.5;
            margin-top: 8px;
        }

        /* 分享按钮 */
        .share-section {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-md);
            margin-bottom: 20px;
        }

        .share-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 16px;
            text-align: center;
        }

        .share-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .share-btn {
            flex: 1;
            min-width: 100px;
            padding: 14px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .share-btn:active {
            transform: scale(0.95);
        }

        .share-btn.wechat {
            background: #07C160;
            color: white;
        }

        .share-btn.weibo {
            background: #E6162D;
            color: white;
        }

        .share-btn.copy {
            background: var(--bg-warm);
            color: var(--text-medium);
            border: 1px solid var(--border-light);
        }

        .share-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .share-btn .btn-icon {
            font-size: 18px;
        }

        .restart-btn {
            background: var(--bg-card);
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 16px 48px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 auto 30px;
            display: block;
        }

        .restart-btn:hover {
            background: var(--primary);
            color: white;
            box-shadow: 0 8px 24px rgba(232, 101, 43, 0.3);
        }

        /* 页脚 */
        .footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 12px;
        }

        /* 动画 */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .fade-in {
            animation: fadeInUp 0.5s ease forwards;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .title {
                font-size: 42px;
            }
            
            .subtitle {
                font-size: 16px;
            }
            
            .question-text {
                font-size: 18px;
            }
            
            .result-title {
                font-size: 28px;
            }
            
            .features {
                gap: 12px;
            }
            
            .feature {
                padding: 16px 8px;
            }
            
            .feature-icon {
                font-size: 28px;
            }

            .dimension-explanations {
                grid-template-columns: 1fr;
            }
        }

        /* 加载状态 */
        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 248, 242, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .loading.active {
            display: flex;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border-light);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            margin-top: 16px;
            color: var(--text-light);
            font-size: 14px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-dark);
            color: white;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            z-index: 1001;
            transition: transform 0.3s ease;
            box-shadow: var(--shadow-lg);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    
    <div class="container">
        <!-- 首页 -->
        <div class="home-page" id="homePage">
            <div class="logo-container">
                <div class="logo">🍕</div>
                <span class="logo-badge">2024</span>
            </div>
            <h1 class="title">FoodTI</h1>
            <p class="subtitle">测测你的食物人格是什么？</p>
            <p class="subtitle-secondary">四个维度，二十道题，解码你的美食DNA</p>
            <button class="start-btn" onclick="startTest()">开始测试</button>
            <div class="features">
                <div class="feature">
                    <span class="feature-icon">🎯</span>
                    <span class="feature-text">40+题库<br>随机20题</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">📊</span>
                    <span class="feature-text">四维度<br>深度分析</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">🎁</span>
                    <span class="feature-text">8种人格<br>精准匹配</span>
                </div>
            </div>
        </div>

        <!-- 问题页 -->
        <div class="question-page" id="questionPage">
            <div class="progress-container">
                <div class="progress-header">
                    <span class="progress-text">第 <span id="currentNum">1</span> / 20 题</span>
                    <span class="progress-percent" id="progressPercent">5%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
            <div class="question-card" id="questionCard">
                <span class="question-dimension" id="questionDimension"></span>
                <div class="question-text" id="questionText"></div>
                <div class="options" id="optionsContainer"></div>
            </div>
        </div>

        <!-- 结果页 -->
        <div class="result-page" id="resultPage">
            <div class="result-hero">
                <div class="result-emoji" id="resultEmoji"></div>
                <div class="result-type-label">你的食物人格</div>
                <h2 class="result-title" id="resultTitle"></h2>
                <p class="result-english" id="resultEnglish"></p>
            </div>
            
            <div class="result-card">
                <div class="card-title">
                    <span class="card-title-icon">📝</span>
                    人格解读
                </div>
                <div class="result-description" id="resultDescription"></div>
            </div>

            <div class="result-card">
                <div class="card-title">
                    <span class="card-title-icon">✨</span>
                    核心特质
                </div>
                <div class="traits-grid" id="traitsContainer"></div>
            </div>
            
            <div class="radar-section">
                <div class="card-title" style="justify-content: center;">
                    <span class="card-title-icon">📊</span>
                    四维度分析
                </div>
                <div class="radar-wrapper">
                    <canvas id="radarChart"></canvas>
                </div>
                <div class="dimension-explanations" id="dimensionExplanations"></div>
            </div>
            
            <div class="share-section">
                <div class="share-title">分享给好友，看看他们的食物人格</div>
                <div class="share-buttons">
                    <button class="share-btn wechat" onclick="shareToWechat()">
                        <span class="btn-icon">💬</span>
                        微信
                    </button>
                    <button class="share-btn weibo" onclick="shareToWeibo()">
                        <span class="btn-icon">📢</span>
                        微博
                    </button>
                    <button class="share-btn copy" onclick="copyResult()">
                        <span class="btn-icon">📋</span>
                        复制结果
                    </button>
                </div>
            </div>
            
            <button class="restart-btn" onclick="restartTest()">重新测试</button>
            
            <div class="footer">
                <p>FoodTI 食物人格测试 · 发现你的美食DNA</p>
            </div>
        </div>
    </div>

    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">正在分析你的食物人格...</div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // 题库 - 每个维度10+道题，共40+道
        const questionBank = [
            // ========== 冒险度 vs 安全感 (AS) ==========

            currentQuestion = 0;
            dimensions = { adventure: 0, process: 0, share: 0, intuition: 0 };
            
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('questionPage').style.display = 'flex';
            showQuestion();
        }

        function showQuestion() {
            const q = selectedQuestions[currentQuestion];
            const progress = ((currentQuestion + 1) / 20) * 100;
            
            document.getElementById('currentNum').textContent = currentQuestion + 1;
            document.getElementById('progressPercent').textContent = Math.round(progress) + '%';
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('questionDimension').textContent = q.dimensionName;
            document.getElementById('questionText').textContent = q.question;
            
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            const letters = ['A', 'B'];
            q.options.forEach((option, index) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                optionDiv.innerHTML = `
                    <span class="option-letter">${letters[index]}</span>
                    <span class="option-text">${option.text}</span>
                `;
                optionDiv.onclick = () => selectOption(index);
                optionsContainer.appendChild(optionDiv);
            });

            // 重置动画
            const card = document.getElementById('questionCard');
            card.classList.remove('fade-in');
            void card.offsetWidth;
            card.classList.add('fade-in');
        }

        function selectOption(index) {
            const q = selectedQuestions[currentQuestion];
            const selectedValue = q.options[index].value;
            
            // 更新维度分数
            switch(q.dimension) {
                case 'AS':
                    if (selectedValue === 'A') dimensions.adventure++;
                    break;
                case 'PO':
                    if (selectedValue === 'P') dimensions.process++;
                    break;
                case 'GS':
                    if (selectedValue === 'G') dimensions.share++;
                    break;
                case 'IA':
                    if (selectedValue === 'I') dimensions.intuition++;
                    break;
            }

            // 高亮选中的选项
            const options = document.querySelectorAll('.option');
            options.forEach(opt => opt.classList.remove('selected'));
            options[index].classList.add('selected');

            // 延迟后进入下一题
            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < selectedQuestions.length) {
                    showQuestion();
                } else {
                    showLoading();
                    setTimeout(() => {
                        hideLoading();
                        showResult();
                    }, 1500);
                }
            }, 400);
        }

        function calculateType() {
            const type = 
                (dimensions.adventure >= 3 ? 'A' : 'S') +
                (dimensions.process >= 3 ? 'P' : 'O') +
                (dimensions.share >= 3 ? 'G' : 'S') +
                (dimensions.intuition >= 3 ? 'I' : 'A');
            return type;
        }

        function showResult() {
            document.getElementById('questionPage').style.display = 'none';
            document.getElementById('resultPage').style.display = 'flex';
            
            const type = calculateType();
            const personality = personalityTypes[type] || personalityTypes['SOGI'];
            
            document.getElementById('resultEmoji').textContent = personality.emoji;
            document.getElementById('resultTitle').textContent = personality.name;
            document.getElementById('resultEnglish').textContent = personality.englishName;
            document.getElementById('resultDescription').textContent = personality.description;
            
            const traitsContainer = document.getElementById('traitsContainer');
            traitsContainer.innerHTML = personality.traits.map(trait => 
                `<span class="trait">${trait}</span>`
            ).join('');
            
            drawRadarChart();
            showDimensionExplanations();
            
            // 滚动到顶部
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showDimensionExplanations() {
            const container = document.getElementById('dimensionExplanations');
            const total = 5; // 每个维度5道题
            
            const dimensionData = [
                {
                    name: '冒险 vs 安全',
                    icon: '🎯',
                    score: dimensions.adventure,
                    total: total,
                    left: 'A',
                    right: 'S',
                    leftName: '冒险型',
                    rightName: '安全型'
                },
                {
                    name: '过程 vs 结果',
                    icon: '⚡',
                    score: dimensions.process,
                    total: total,
                    left: 'P',
                    right: 'O',
                    leftName: '过程型',
                    rightName: '结果型'
                },
                {
                    name: '共享 vs 独享',
                    icon: '🤝',
                    score: dimensions.share,
                    total: total,
                    left: 'G',
                    right: 'S',
                    leftName: '共享型',
                    rightName: '独享型'
                },
                {
                    name: '直觉 vs 分析',
                    icon: '💫',
                    score: dimensions.intuition,
                    total: total,
                    left: 'I',
                    right: 'A',
                    leftName: '直觉型',
                    rightName: '分析型'
                }
            ];

            container.innerHTML = dimensionData.map(d => {
                const percent = Math.round((d.score / d.total) * 100);
                const isLeft = d.score >= 3;
                const resultType = isLeft ? d.leftName : d.rightName;
                const resultIcon = isLeft ? d.left : d.right;
                const info = dimensionInfo[resultIcon] || dimensionInfo[resultIcon + '2'];
                
                return `
                    <div class="dimension-card">
                        <div class="dimension-header">
                            <span class="dimension-icon">${d.icon}</span>
                            <span class="dimension-name">${d.name}</span>
                        </div>
                        <div class="dimension-score">${d.score}/${d.total}</div>
                        <div class="dimension-label">倾向于: ${resultType}</div>
                        <div class="dimension-desc">${info ? info.description : ''}</div>
                    </div>
                `;
            }).join('');
        }

        function drawRadarChart() {
            const canvas = document.getElementById('radarChart');
            const ctx = canvas.getContext('2d');
            const size = 280;
            canvas.width = size * 2;
            canvas.height = size * 2;
            canvas.style.width = size + 'px';
            canvas.style.height = size + 'px';
            ctx.scale(2, 2);
            
            const centerX = size / 2;
            const centerY = size / 2;
            const radius = 100;
            
            // 清空画布
            ctx.clearRect(0, 0, size, size);
            
            // 维度标签
            const labels = ['冒险度', '过程型', '共享型', '直觉型'];
            const values = [
                dimensions.adventure / 5,
                dimensions.process / 5,
                dimensions.share / 5,
                dimensions.intuition / 5
            ];
            
            // 绘制背景网格
            for (let i = 5; i > 0; i--) {
                const r = (radius * i) / 5;
                ctx.beginPath();
                for (let j = 0; j < 4; j++) {
                    const angle = (Math.PI / 2) + (Math.PI * 2 * j) / 4;
                    const x = centerX + r * Math.cos(angle);
                    const y = centerY - r * Math.sin(angle);
                    if (j === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.strokeStyle = 'rgba(232, 101, 43, 0.1)';
                ctx.lineWidth = 1;
                ctx.stroke();
                
                if (i % 2 === 0) {
                    ctx.fillStyle = 'rgba(232, 101, 43, 0.03)';
                    ctx.fill();
                }
            }
            
            // 绘制坐标轴
            for (let i = 0; i < 4; i++) {
                const angle = (Math.PI / 2) + (Math.PI * 2 * i) / 4;
                const x = centerX + radius * Math.cos(angle);
                const y = centerY - radius * Math.sin(angle);
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(x, y);
                ctx.strokeStyle = 'rgba(232, 101, 43, 0.15)';
                ctx.lineWidth = 1;
                ctx.stroke();
                
                // 绘制标签
                const labelX = centerX + (radius + 28) * Math.cos(angle);
                const labelY = centerY - (radius + 28) * Math.sin(angle);
                ctx.font = '600 13px -apple-system, sans-serif';
                ctx.fillStyle = '#5C3D2E';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(labels[i], labelX, labelY);
            }
            
            // 绘制数据区域
            ctx.beginPath();
            for (let i = 0; i < 4; i++) {
                const angle = (Math.PI / 2) + (Math.PI * 2 * i) / 4;
                const r = radius * Math.max(0.2, values[i]);
                const x = centerX + r * Math.cos(angle);
                const y = centerY - r * Math.sin(angle);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            
            // 渐变填充
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
            gradient.addColorStop(0, 'rgba(232, 101, 43, 0.3)');
            gradient.addColorStop(1, 'rgba(255, 140, 66, 0.15)');
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.strokeStyle = '#E8652B';
            ctx.lineWidth = 2.5;
            ctx.stroke();
            
            // 绘制数据点
            for (let i = 0; i < 4; i++) {
                const angle = (Math.PI / 2) + (Math.PI * 2 * i) / 4;
                const r = radius * Math.max(0.2, values[i]);
                const x = centerX + r * Math.cos(angle);
                const y = centerY - r * Math.sin(angle);
                
                // 外圈光晕
                ctx.beginPath();
                ctx.arc(x, y, 8, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(232, 101, 43, 0.2)';
                ctx.fill();
                
                // 内圈
                ctx.beginPath();
                ctx.arc(x, y, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#E8652B';
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function showLoading() {
            document.getElementById('loading').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loading').classList.remove('active');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function shareToWechat() {
            showToast('请截图分享到微信朋友圈或好友');
        }

        function shareToWeibo() {
            const type = calculateType();
            const personality = personalityTypes[type];
            const text = `我的FoodTI食物人格是【${personality.name}】${personality.emoji}！${personality.description.substring(0, 50)}... 快来测测你的食物人格是什么？`;
            const url = `https://service.weibo.com/share/share.php?title=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }

        function copyResult() {
            const type = calculateType();
            const personality = personalityTypes[type];
            const text = `🍕 FoodTI 食物人格测试\n\n我的结果：${personality.emoji} ${personality.name}\n${personality.englishName}\n\n${personality.description}\n\n快来测测你的食物人格吧！`;
            
            navigator.clipboard.writeText(text).then(() => {
                showToast('结果已复制到剪贴板，快去分享吧！');
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('结果已复制到剪贴板，快去分享吧！');
            });
        }

        function restartTest() {
            currentQuestion = 0;
            dimensions = { adventure: 0, process: 0, share: 0, intuition: 0 };
            document.getElementById('resultPage').style.display = 'none';
            document.getElementById('homePage').style.display = 'flex';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
