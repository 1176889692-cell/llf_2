<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodTI - 食物人格测试</title>
    <meta name="description" content="通过20道精选题目，解码你的美食DNA，发现你的食物人格类型">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍕</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #E8652B;
            --primary-light: #FF8C42;
            --primary-dark: #C74E1A;
            --accent: #FFB347;
            --bg-warm: #FFF8F2;
            --bg-card: #FFFFFF;
            --text-dark: #2D1810;
            --text-medium: #5C3D2E;
            --text-light: #8B6B5A;
            --text-muted: #A68B7B;
            --border-light: #FFE4CC;
            --shadow-sm: 0 2px 8px rgba(45, 24, 16, 0.08);
            --shadow-md: 0 8px 24px rgba(45, 24, 16, 0.12);
            --shadow-lg: 0 16px 48px rgba(45, 24, 16, 0.16);
            --radius-sm: 12px;
            --radius-md: 16px;
            --radius-lg: 24px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
            background: var(--bg-warm);
            min-height: 100vh;
            color: var(--text-dark);
        }

        .bg-pattern {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
            background: radial-gradient(circle at 20% 20%, rgba(232, 101, 43, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(255, 179, 71, 0.08) 0%, transparent 50%);
        }

        .container {
            position: relative; z-index: 1;
            max-width: 520px; margin: 0 auto; padding: 20px;
            min-height: 100vh; display: flex; flex-direction: column;
        }

        /* 首页 */
        .home-page {
            flex: 1; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            padding: 40px 20px; animation: fadeInUp 0.8s ease;
        }

        .logo { font-size: 80px; margin-bottom: 24px; }
        .title {
            font-size: 52px; font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }
        .subtitle { font-size: 18px; color: var(--text-medium); margin-bottom: 8px; font-weight: 500; }
        .subtitle-secondary { font-size: 14px; color: var(--text-muted); margin-bottom: 40px; }

        .start-btn {
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            color: white; border: none; padding: 18px 64px; font-size: 18px;
            font-weight: 700; border-radius: 60px; cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 8px 24px rgba(232, 101, 43, 0.35);
        }
        .start-btn:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(232, 101, 43, 0.45); }

        .features {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 16px; margin-top: 48px; width: 100%;
        }
        .feature {
            text-align: center; padding: 20px 12px;
            background: var(--bg-card); border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
        }
        .feature-icon { font-size: 32px; margin-bottom: 10px; display: block; }
        .feature-text { font-size: 13px; color: var(--text-light); font-weight: 500; }

        .history-btn {
            margin-top: 24px; background: none; border: 1px solid var(--border-light);
            color: var(--text-light); padding: 10px 24px; border-radius: 30px;
            cursor: pointer; font-size: 14px; transition: all 0.3s ease;
        }
        .history-btn:hover { border-color: var(--primary); color: var(--primary); }

        /* 进度条 */
        .progress-container {
            background: var(--bg-card); border-radius: var(--radius-md);
            padding: 16px 20px; box-shadow: var(--shadow-sm); margin-bottom: 20px;
        }
        .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .progress-text { font-size: 14px; color: var(--text-light); font-weight: 500; }
        .progress-percent { font-size: 14px; color: var(--primary); font-weight: 700; }
        .progress-bar { background: var(--border-light); height: 8px; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary-light), var(--primary)); border-radius: 4px; transition: width 0.5s ease; }

        /* 问题页 */
        .question-page {
            flex: 1; display: none; flex-direction: column;
            padding: 20px 0; animation: fadeInUp 0.5s ease;
        }
        .question-card {
            background: var(--bg-card); border-radius: var(--radius-lg);
            padding: 28px 24px; box-shadow: var(--shadow-md); margin-bottom: 16px;
        }
        .question-dimension {
            display: inline-block; font-size: 11px; font-weight: 700;
            color: var(--primary); background: rgba(232, 101, 43, 0.1);
            padding: 4px 12px; border-radius: 20px; margin-bottom: 16px;
        }
        .question-text { font-size: 20px; font-weight: 600; line-height: 1.6; margin-bottom: 24px; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: var(--bg-warm); border: 2px solid transparent;
            border-radius: var(--radius-sm); padding: 16px 20px;
            cursor: pointer; transition: all 0.3s ease; font-size: 15px;
            display: flex; align-items: center; gap: 14px;
        }
        .option-letter {
            width: 32px; height: 32px; background: var(--bg-card);
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-weight: 700; font-size: 14px;
            color: var(--text-light); flex-shrink: 0;
        }
        .option:hover { border-color: var(--primary-light); background: rgba(255, 140, 66, 0.08); transform: translateX(4px); }
        .option:hover .option-letter { background: var(--primary-light); color: white; }
        .option.selected { border-color: var(--primary); background: linear-gradient(135deg, rgba(232, 101, 43, 0.08), rgba(255, 179, 71, 0.08)); }
        .option.selected .option-letter { background: var(--primary); color: white; }

        /* 结果页 */
        .result-page {
            flex: 1; display: none; flex-direction: column;
            padding: 20px 0; animation: fadeInUp 0.6s ease;
        }
        .result-hero {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: var(--radius-lg); padding: 36px 28px;
            text-align: center; margin-bottom: 20px;
            box-shadow: 0 12px 40px rgba(232, 101, 43, 0.3);
        }
        .result-avatar { margin-bottom: 16px; }
        .result-type-label { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.8); letter-spacing: 2px; margin-bottom: 8px; }
        .result-title { font-size: 32px; font-weight: 900; color: white; margin-bottom: 6px; }
        .result-english { font-size: 14px; color: rgba(255,255,255,0.7); letter-spacing: 1px; }

        .result-card {
            background: var(--bg-card); border-radius: var(--radius-lg);
            padding: 24px; box-shadow: var(--shadow-md); margin-bottom: 16px;
        }
        .card-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .result-description { font-size: 15px; color: var(--text-medium); line-height: 1.8; }
        .traits-grid { display: flex; flex-wrap: wrap; gap: 10px; }
        .trait {
            background: linear-gradient(135deg, rgba(232, 101, 43, 0.08), rgba(255, 179, 71, 0.12));
            border: 1px solid rgba(232, 101, 43, 0.15);
            padding: 8px 16px; border-radius: 24px; font-size: 13px;
            font-weight: 600; color: var(--primary);
        }

        /* 行为分析 */
        .behavior-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 0; border-bottom: 1px solid var(--border-light);
        }
        .behavior-item:last-child { border-bottom: none; }
        .behavior-icon { font-size: 24px; }
        .behavior-content { flex: 1; }
        .behavior-label { font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
        .behavior-value { font-size: 15px; font-weight: 600; color: var(--text-dark); }

        /* DNA图 */
        .dna-section {
            background: var(--bg-card); border-radius: var(--radius-lg);
            padding: 24px; box-shadow: var(--shadow-md); margin-bottom: 16px;
        }
        .dna-chart { display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px; }
        .dna-bar { display: flex; align-items: center; gap: 12px; }
        .dna-label { width: 80px; font-size: 13px; font-weight: 600; color: var(--text-medium); text-align: right; }
        .dna-track { flex: 1; height: 24px; background: var(--bg-warm); border-radius: 12px; overflow: hidden; }
        .dna-fill {
            height: 100%; border-radius: 12px; transition: width 1s ease;
            display: flex; align-items: center; justify-content: flex-end;
            padding-right: 8px; font-size: 12px; font-weight: 700; color: white;
        }
        .dna-value { width: 50px; font-size: 14px; font-weight: 700; color: var(--primary); }

        .dimension-explanations { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .dimension-card { background: var(--bg-warm); border-radius: var(--radius-sm); padding: 16px; }
        .dimension-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .dimension-icon { font-size: 20px; }
        .dimension-name { font-size: 13px; font-weight: 700; }
        .dimension-score { font-size: 24px; font-weight: 900; color: var(--primary); margin-bottom: 4px; }
        .dimension-label { font-size: 11px; color: var(--text-muted); }
        .dimension-desc { font-size: 12px; color: var(--text-light); line-height: 1.5; margin-top: 8px; }

        /* 分享 */
        .share-section {
            background: var(--bg-card); border-radius: var(--radius-lg);
            padding: 24px; box-shadow: var(--shadow-md); margin-bottom: 20px;
        }
        .share-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; text-align: center; }
        .share-link-box {
            background: var(--bg-warm); border-radius: var(--radius-sm);
            padding: 12px 16px; margin-bottom: 16px;
            display: flex; align-items: center; gap: 8px;
        }
        .share-link-input {
            flex: 1; border: none; background: none; font-size: 13px;
            color: var(--text-medium); outline: none;
        }
        .copy-link-btn {
            background: var(--primary); color: white; border: none;
            padding: 8px 16px; border-radius: 20px; font-size: 12px;
            font-weight: 600; cursor: pointer; transition: all 0.3s ease;
        }
        .copy-link-btn:hover { background: var(--primary-dark); }
        .share-buttons { display: flex; gap: 12px; }
        .share-btn {
            flex: 1; padding: 14px 16px; border: none;
            border-radius: var(--radius-sm); font-size: 14px; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .share-btn.wechat { background: #07C160; color: white; }
        .share-btn.weibo { background: #E6162D; color: white; }
        .share-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

        .restart-btn {
            background: var(--bg-card); color: var(--primary);
            border: 2px solid var(--primary); padding: 16px 48px;
            font-size: 16px; font-weight: 700; border-radius: 60px;
            cursor: pointer; transition: all 0.3s ease;
            margin: 0 auto 30px; display: block;
        }
        .restart-btn:hover { background: var(--primary); color: white; }

        /* 历史页 */
        .history-page {
            flex: 1; display: none; flex-direction: column;
            padding: 20px 0; animation: fadeInUp 0.5s ease;
        }
        .history-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 20px;
        }
        .back-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-medium); padding: 8px; }
        .history-title { font-size: 20px; font-weight: 700; }
        .history-list { display: flex; flex-direction: column; gap: 12px; }
        .history-item {
            background: var(--bg-card); border-radius: var(--radius-md);
            padding: 16px 20px; box-shadow: var(--shadow-sm);
            cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; gap: 16px;
        }
        .history-item:hover { transform: translateX(4px); box-shadow: var(--shadow-md); }
        .history-avatar { width: 60px; height: 60px; }
        .history-info { flex: 1; }
        .history-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .history-date { font-size: 13px; color: var(--text-muted); }
        .history-arrow { font-size: 20px; color: var(--text-muted); }
        .empty-history { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-history-icon { font-size: 60px; margin-bottom: 16px; }
        .empty-history-text { font-size: 16px; }

        /* Toast */
        .toast {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-dark); color: white;
            padding: 14px 28px; border-radius: 50px;
            font-size: 14px; z-index: 1001;
            transition: transform 0.3s ease; box-shadow: var(--shadow-lg);
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .title { font-size: 42px; }
            .question-text { font-size: 18px; }
            .result-title { font-size: 28px; }
            .dimension-explanations { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    
    <div class="container">
        <!-- 首页 -->
        <div class="home-page" id="homePage">
            <div class="logo">🍕</div>
            <h1 class="title">FoodTI</h1>
            <p class="subtitle">测测你的食物人格是什么？</p>
            <p class="subtitle-secondary">四个维度 · 十六种人格 · 解码你的美食DNA</p>
            <button class="start-btn" onclick="startTest()">开始测试</button>
            <div class="features">
                <div class="feature">
                    <span class="feature-icon">🎯</span>
                    <span class="feature-text">20道精选题</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">🧬</span>
                    <span class="feature-text">16种人格</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">📊</span>
                    <span class="feature-text">深度分析</span>
                </div>
            </div>
            <button class="history-btn" onclick="showHistory()">📋 查看历史记录</button>
        </div>

        <!-- 问题页 -->
        <div class="question-page" id="questionPage">
            <div class="progress-container">
                <div class="progress-header">
                    <span class="progress-text">第 <span id="currentNum">1</span> / 20 题</span>
                    <span class="progress-percent" id="progressPercent">5%</span>
                </div>
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            </div>
            <div class="question-card" id="questionCard">
                <span class="question-dimension" id="questionDimension"></span>
                <div class="question-text" id="questionText"></div>
                <div class="options" id="optionsContainer"></div>
            </div>
        </div>

        <!-- 结果页 -->
        <div class="result-page" id="resultPage">
            <div class="result-hero">
                <div class="result-avatar" id="resultAvatar"></div>
                <div class="result-type-label">你的食物人格</div>
                <h2 class="result-title" id="resultTitle"></h2>
                <p class="result-english" id="resultEnglish"></p>
            </div>
            
            <div class="result-card">
                <div class="card-title">📝 人格解读</div>
                <div class="result-description" id="resultDescription"></div>
            </div>

            <div class="result-card">
                <div class="card-title">✨ 核心特质</div>
                <div class="traits-grid" id="traitsContainer"></div>
            </div>

            <div class="result-card">
                <div class="card-title">🔍 行为分析</div>
                <div id="behaviorAnalysis"></div>
            </div>
            
            <div class="dna-section">
                <div class="card-title" style="justify-content: center;">🧬 美食DNA图谱</div>
                <div class="dna-chart" id="dnaChart"></div>
                <div class="dimension-explanations" id="dimensionExplanations"></div>
            </div>
            
            <div class="share-section">
                <div class="share-title">分享给好友，看看他们的食物人格</div>
                <div class="share-link-box">
                    <input type="text" class="share-link-input" id="shareLink" readonly>
                    <button class="copy-link-btn" onclick="copyShareLink()">复制链接</button>
                </div>
                <div class="share-buttons">
                    <button class="share-btn wechat" onclick="shareToWechat()">💬 微信</button>
                    <button class="share-btn weibo" onclick="shareToWeibo()">📢 微博</button>
                </div>
            </div>
            
            <button class="restart-btn" onclick="restartTest()">重新测试</button>
        </div>

        <!-- 历史页 -->
        <div class="history-page" id="historyPage">
            <div class="history-header">
                <button class="back-btn" onclick="backToHome()">←</button>
                <div class="history-title">历史记录</div>
                <div></div>
            </div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // 全身卡通小人SVG - 每个人格独特设计
        const avatarSVGs = {
            explorer: `<svg width="120" height="160" viewBox="0 0 120 160">
                <!-- 探险家小人 -->
                <circle cx="60" cy="35" r="25" fill="#FFD4A8"/>

            </svg>`,
            
            calculator: `<svg width="120" height="160" viewBox="0 0 120 160">
                <!-- 营养计算器小人 -->
                <circle cx="60" cy="35" r="25" fill="#FFD4A8"/>
                <circle cx="52" cy="32" r="3" fill="#2D1810"/>

                <circle cx="52" cy="32" r="8" fill="none" stroke="#4A90D9" stroke-width="2"/>

                <line x1="60" y1="32" x2="60" y2="32" stroke="#4A90D9" stroke-width="2"/>
                <!-- 身体 - 西装 -->
                <rect x="42" y="60" width="36" height="45" rx="5" fill="#4A90D9"/>
                <rect x="55" y="60" width="10" height="45" fill="#3A7BC8"/>
                <polygon points="60,60 55,75 65,75" fill="white"/>
                <!-- 衬衫 -->
                <rect x="52" y="60" width="16" height="10" fill="white"/>
                <!-- 手臂 - 拿计算器 -->
                <path d="M42 70 L22 80 L25 85" stroke="#FFD4A8" stroke-width="8" stroke-linecap="round" fill="none"/>
                <path d="M78 70 L98 65" stroke="#FFD4A8" stroke-width="8" stroke-linecap="round" fill="none"/>
                <rect x="95" y="55" width="18" height="25" rx="3" fill="#333"/>
                <rect x="97" y="58" width="14" height="10" rx="1" fill="#7BC67E"/>
                <rect x="97" y="70" width="4" height="3" rx="1" fill="#666"/>
                <rect x="103" y="70" width="4" height="3" rx="1" fill="#666"/>
                <rect x="109" y="70" width="4" height="3" rx="1" fill="#666"/>
                <!-- 腿 -->
                <rect x="48" y="105" width="10" height="35" rx="5" fill="#2D3748"/>
                <rect x="62" y="105" width="10" height="35" rx="5" fill="#2D3748"/>
                <!-- 皮鞋 -->
                <ellipse cx="53" cy="142" rx="10" ry="5" fill="#1A1A1A"/>
                <ellipse cx="67" cy="142" rx="10" ry="5" fill="#1A1A1A"/>
            </svg>`,
            
            social: `<svg width="120" height="160" viewBox="0 0 120 160">
                <!-- 社交食客小人 -->
                <circle cx="60" cy="35" r="25" fill="#FFD4A8"/>
                <circle cx="52" cy="30" r="3" fill="#2D1810"/>
                <circle cx="68" cy="30" r="3" fill="#2D1810"/>

            "O": { name: "结果型", icon: "🎯", desc: "追求美味的结果，效率优先" },
            "G": { name: "共享型", icon: "🤝", desc: "喜欢和他人分享美食，享受社交用餐" },
            "I": { name: "独享型", icon: "🧘", desc: "享受独自用餐的时光，注重个人体验" },
            "SA": { name: "分析型", icon: "🔬", desc: "通过数据和分析做出食物决策" }
        };

        let currentQuestion = 0;
        let selectedQuestions = [];
        let scores = { A: 0, S: 0, P: 0, O: 0, G: 0, I: 0 };
        let history = JSON.parse(localStorage.getItem('foodti_history') || '[]');

        // 检查URL参数是否有结果
        function checkUrlResult() {
            const params = new URLSearchParams(window.location.search);
            const resultType = params.get('r');
            const resultScores = params.get('s');
            
            if (resultType && resultScores && personalityTypes[resultType]) {
                try {
                    const decodedScores = JSON.parse(atob(resultScores));
                    scores = decodedScores;
                    showResultPage(resultType);
                    return true;
                } catch(e) {}
            }
            return false;
        }

        function selectQuestions() {
            const groups = { AS: [], PO: [], GS: [], IA: [] };
            questionBank.forEach(q => groups[q.dimension].push(q));
            selectedQuestions = [];
            Object.values(groups).forEach(group => {
                const shuffled = [...group].sort(() => Math.random() - 0.5);
                selectedQuestions.push(...shuffled.slice(0, 5));
            });
            selectedQuestions.sort(() => Math.random() - 0.5);
        }

        function startTest() {
            selectQuestions();
            currentQuestion = 0;
            scores = { A: 0, S: 0, P: 0, O: 0, G: 0, I: 0 };
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('questionPage').style.display = 'flex';
            showQuestion();
        }

        function showQuestion() {
            const q = selectedQuestions[currentQuestion];
            const progress = ((currentQuestion + 1) / 20) * 100;
            document.getElementById('currentNum').textContent = currentQuestion + 1;
            document.getElementById('progressPercent').textContent = Math.round(progress) + '%';
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('questionDimension').textContent = q.dimensionName;
            document.getElementById('questionText').textContent = q.question;
            
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            const letters = ['A', 'B', 'C', 'D'];
            q.options.forEach((opt, i) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.innerHTML = `<span class="option-letter">${letters[i]}</span><span>${opt.text}</span>`;
                div.onclick = () => selectOption(i);
                container.appendChild(div);
            });
        }

        function selectOption(index) {
            const q = selectedQuestions[currentQuestion];
            const optScores = q.options[index].scores;
            Object.keys(optScores).forEach(key => {
                scores[key] = (scores[key] || 0) + optScores[key];
            });

            const options = document.querySelectorAll('.option');
            options.forEach(o => o.classList.remove('selected'));
            options[index].classList.add('selected');

            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < selectedQuestions.length) {
                    showQuestion();
                } else {
                    const type = calculateType();
                    showResultPage(type);
                }
            }, 400);
        }

        function calculateType() {
            return (scores.A > scores.S ? 'A' : 'S') +
                   (scores.P > scores.O ? 'P' : 'O') +
                   (scores.G > scores.I ? 'G' : 'S') +
                   (scores.I > scores.A ? 'I' : 'A');
        }

        function showResultPage(type) {
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('questionPage').style.display = 'none';
            document.getElementById('resultPage').style.display = 'flex';
            
            const personality = personalityTypes[type] || personalityTypes['SOGI'];
            
            document.getElementById('resultAvatar').innerHTML = avatarSVGs[personality.avatar] || avatarSVGs['casual'];
            document.getElementById('resultTitle').textContent = personality.name;
            document.getElementById('resultEnglish').textContent = personality.englishName;
            document.getElementById('resultDescription').textContent = personality.description;
            document.getElementById('traitsContainer').innerHTML = personality.traits.map(t => `<span class="trait">${t}</span>`).join('');
            
            showBehaviorAnalysis(personality);
            showDNAChart();
            showDimensionExplanations();
            
            // 生成分享链接
            const shareUrl = generateShareLink(type);
            document.getElementById('shareLink').value = shareUrl;
            
            // 保存历史
            if (!window.location.search.includes('r=')) {
                saveHistory(personality, type);
            }
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function generateShareLink(type) {
            const encodedScores = btoa(JSON.stringify(scores));
            const baseUrl = window.location.origin + window.location.pathname;
            return `${baseUrl}?r=${type}&s=${encodedScores}`;
        }

        function showBehaviorAnalysis(personality) {
            const container = document.getElementById('behaviorAnalysis');
            const icons = { dining: '🍽️', cooking: '👨‍🍳', social: '👥', shopping: '🛒' };
            const labels = { dining: '用餐习惯', cooking: '烹饪风格', social: '社交特点', shopping: '采购偏好' };
            container.innerHTML = Object.entries(personality.behavior).map(([key, value]) => `
                <div class="behavior-item">
                    <span class="behavior-icon">${icons[key]}</span>
                    <div class="behavior-content">
                        <div class="behavior-label">${labels[key]}</div>
                        <div class="behavior-value">${value}</div>
                    </div>
                </div>
            `).join('');
        }

        function showDNAChart() {
            const container = document.getElementById('dnaChart');
            const maxScore = 15;
            const dimensions = [
                { name: '冒险度', value: scores.A, max: maxScore, color: '#E8652B' },
                { name: '过程型', value: scores.P, max: maxScore, color: '#FF8C42' },
                { name: '共享型', value: scores.G, max: maxScore, color: '#FFB347' },
                { name: '直觉型', value: scores.I, max: maxScore, color: '#FFD699' }
            ];
            container.innerHTML = dimensions.map(d => {
                const percent = Math.round((d.value / d.max) * 100);
                return `<div class="dna-bar">
                    <span class="dna-label">${d.name}</span>
                    <div class="dna-track"><div class="dna-fill" style="width: ${percent}%; background: ${d.color};">${percent}%</div></div>
                    <span class="dna-value">${d.value}/${d.max}</span>
                </div>`;
            }).join('');
        }

        function showDimensionExplanations() {
            const container = document.getElementById('dimensionExplanations');
            const data = [
                { name: '冒险 vs 安全', icon: '🎯', score: scores.A, total: 15, type: scores.A > scores.S ? 'A' : 'S' },
                { name: '过程 vs 结果', icon: '⚡', score: scores.P, total: 15, type: scores.P > scores.O ? 'P' : 'O' },
                { name: '共享 vs 独享', icon: '🤝', score: scores.G, total: 15, type: scores.G > scores.I ? 'G' : 'I' },
                { name: '直觉 vs 分析', icon: '💫', score: scores.I, total: 15, type: scores.I > scores.A ? 'I' : 'SA' }
            ];
            container.innerHTML = data.map(d => {
                const info = dimensionInfo[d.type];
                return `<div class="dimension-card">
                    <div class="dimension-header"><span class="dimension-icon">${d.icon}</span><span class="dimension-name">${d.name}</span></div>
                    <div class="dimension-score">${d.score}/${d.total}</div>
                    <div class="dimension-label">倾向于: ${info.name}</div>
                    <div class="dimension-desc">${info.desc}</div>
                </div>`;
            }).join('');
        }

        function saveHistory(personality, type) {
            const record = {
                id: Date.now(),
                type: type,
                name: personality.name,
                avatar: personality.avatar,
                scores: { ...scores },
                date: new Date().toLocaleDateString('zh-CN')
            };
            history.unshift(record);
            if (history.length > 20) history.pop();
            localStorage.setItem('foodti_history', JSON.stringify(history));
        }

        function showHistory() {
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('historyPage').style.display = 'flex';
            const container = document.getElementById('historyList');
            if (history.length === 0) {
                container.innerHTML = '<div class="empty-history"><div class="empty-history-icon">📋</div><div class="empty-history-text">暂无历史记录</div></div>';
            } else {
                container.innerHTML = history.map(h => `
                    <div class="history-item" onclick="viewHistoryItem(${h.id})">
                        <div class="history-avatar">${avatarSVGs[h.avatar] || avatarSVGs['casual']}</div>
                        <div class="history-info"><div class="history-name">${h.name}</div><div class="history-date">${h.date}</div></div>
                        <span class="history-arrow">→</span>
                    </div>
                `).join('');
            }
        }

        function viewHistoryItem(id) {
            const item = history.find(h => h.id === id);
            if (!item) return;
            scores = { ...item.scores };
            document.getElementById('historyPage').style.display = 'none';
            showResultPage(item.type);
        }

        function backToHome() {
            document.getElementById('historyPage').style.display = 'none';
            document.getElementById('homePage').style.display = 'flex';
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function copyShareLink() {
            const linkInput = document.getElementById('shareLink');
            linkInput.select();
            document.execCommand('copy');
            showToast('链接已复制，快去分享吧！');
        }

        function shareToWechat() {
            copyShareLink();
            showToast('链接已复制，请粘贴发送给微信好友');
        }

        function shareToWeibo() {
            const type = calculateType();
            const p = personalityTypes[type];
            const text = `我的FoodTI食物人格是【${p.name}】！快来测测你的食物人格是什么？`;
            window.open(`https://service.weibo.com/share/share.php?title=${encodeURIComponent(text)}`, '_blank');
        }

        function restartTest() {
            window.location.href = window.location.pathname;
        }

        // 页面加载时检查URL
        window.onload = function() {
            if (!checkUrlResult()) {
                // 正常显示首页
            }
        };
    </script>
</body>
</html>
